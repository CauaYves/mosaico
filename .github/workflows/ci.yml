name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Referência da skill
        run: node apps/docs/scripts/sync-ia.mjs --check

      - name: Registry
        run: pnpm --filter @multiclubes/ui registry:check

      - name: Tipos
        run: pnpm check-types

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
